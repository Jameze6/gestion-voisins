<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Gestion des voisins</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050812;
            --blue: #00aaff;
            --cyan: #00f0ff;
            --purple: #9b5cff;
            --red: #ff3b6b;
            --text: #f2f7ff;
            --muted: #8d9ab5;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(0, 170, 255, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(155, 92, 255, 0.16),
                    transparent 30%
                ),
                #050812;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            padding: 35px;

            background:
                linear-gradient(
                    145deg,
                    rgba(13, 23, 43, 0.98),
                    rgba(7, 14, 29, 0.98)
                );

            border: 1px solid rgba(0, 220, 255, 0.25);

            border-radius: 20px;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.65),
                0 0 40px rgba(0, 180, 255, 0.10);
        }

        .logo {
            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;

            filter:
                drop-shadow(
                    0 0 15px rgba(0, 240, 255, 0.55)
                );
        }

        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;

            color: white;

            text-shadow:
                0 0 12px rgba(0, 240, 255, 0.45);
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 14px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #dce7fa;

            font-size: 14px;

            font-weight: bold;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid rgba(0, 200, 255, 0.2);

            outline: none;

            background: #070e1d;

            color: white;

            font-size: 15px;

            transition: 0.25s;
        }

        input:focus {
            border-color: var(--cyan);

            box-shadow:
                0 0 16px rgba(0, 240, 255, 0.15);
        }

        input::placeholder {
            color: #59677f;
        }

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #007cff,
                    #00d9ff
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(0, 190, 255, 0.22);

            transition: 0.25s;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(0, 220, 255, 0.4);
        }

        .login-button:disabled {
            opacity: 0.6;

            cursor: wait;

            transform: none;
        }

        #message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 9px;

            text-align: center;

            font-size: 13px;
        }

        #message.error {
            display: block;

            color: #ff6688;

            background: rgba(255, 59, 107, 0.08);

            border: 1px solid rgba(255, 59, 107, 0.3);
        }

        #message.success {
            display: block;

            color: #00ff9d;

            background: rgba(0, 255, 157, 0.08);

            border: 1px solid rgba(0, 255, 157, 0.3);
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #53617a;

            font-size: 11px;
        }

        @media (max-width: 500px) {

            .login-box {
                padding: 28px 22px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 48px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🏢</div>

    <h1>Gestion des voisins</h1>

    <p class="subtitle">
        Connexion à votre espace
    </p>

    <form id="loginForm">

        <div class="input-group">

            <label for="email">
                📧 Adresse e-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Votre adresse e-mail"
                required
                autocomplete="email"
            >

        </div>

        <div class="input-group">

            <label for="password">
                🔒 Mot de passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
                autocomplete="current-password"
            >

        </div>

        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            SE CONNECTER
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        Système de gestion des voisins
    </div>

</div>


<script type="module">

    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // =================================================
    // CONFIGURATION SUPABASE
    // =================================================

    const SUPABASE_URL =
        "https://utcikoustplmvkeigzqy.supabase.co";

    const SUPABASE_KEY =
        "Adminbt07";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =================================================
    // ELEMENTS
    // =================================================

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // =================================================
    // MESSAGE
    // =================================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className = type;

    }


    // =================================================
    // CONNEXION
    // =================================================

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            loginButton.disabled = true;

            loginButton.textContent =
                "CONNEXION...";

            message.className = "";

            message.style.display = "none";


            try {

                const {
                    data,
                    error
                } =
                await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });


                if (error) {

                    throw error;

                }


                showMessage(
                    "✅ Connexion réussie...",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "index.html";

                }, 700);


            } catch (error) {

                console.error(error);


                showMessage(
                    "❌ E-mail ou mot de passe incorrect.",
                    "error"
                );


                loginButton.disabled = false;

                loginButton.textContent =
                    "SE CONNECTER";

            }

        }
    );


    // =================================================
    // SI DEJA CONNECTÉ
    // =================================================

    const {
        data: {
            session
        }
    } =
    await supabase.auth.getSession();


    if (session) {

        window.location.href =
            "index.html";

    }

</script>

</body>
</html>
